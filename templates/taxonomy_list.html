{% extends "base.html" %}
{% block main %}
<div class="container">
  <h1>{{ taxonomy.name | title }}</h1>
  <div class="row">
    <div class="col col-12">
      <div class="container__inner animate">
        <nav class="taxonomy-tags" aria-label="{{ taxonomy.name | title }}">
          {% for term in terms %}
            <a href="{{ term.permalink }}" class="taxonomy-tags__tag">{{ term.name }}</a>
          {% endfor %}
        </nav>
      </div>
    </div>
  </div>
</div>
{% endblock %}
